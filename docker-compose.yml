version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: res_subject_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: res_subject_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/res_subject_db
      - EXCEL_PATH=/app/data/3007_DKGD_hoc_ky_1_nam_hoc_2026_2027_Open.xlsx
    volumes:
      - "E:/downloads/ZALO/3007_DKGD hoc ky 1 nam hoc 2026_2027 Open.xlsx:/app/data/3007_DKGD_hoc_ky_1_nam_hoc_2026_2027_Open.xlsx:ro"
    depends_on:
      - mongo
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: res_subject_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
